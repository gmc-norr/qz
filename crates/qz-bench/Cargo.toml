[package]
name = "qz-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Benchmarking tools for QZ FASTQ compression"

[dependencies]
qz-lib = { workspace = true }
strobealign = { path = "../strobealign" }
mimalloc = "0.1.50"
rayon.workspace = true
rustc-hash.workspace = true
syncmers.workspace = true
anyhow.workspace = true
tempfile.workspace = true
libc.workspace = true
flate2.workspace = true
memchr = "2.8"

[[bin]]
name = "bench_map_only"
path = "src/bin/bench_map_only.rs"

[[bin]]
name = "analyze_hashes"
path = "src/bin/analyze_hashes.rs"

[[bin]]
name = "bench_bsc_assists"
path = "src/bin/bench_bsc_assists.rs"

[[bin]]
name = "bench_coil_strategies"
path = "src/bin/bench_coil_strategies.rs"

[[bin]]
name = "bench_columnar"
path = "src/bin/bench_columnar.rs"

[[bin]]
name = "bench_fqz_flags"
path = "src/bin/bench_fqz_flags.rs"

[[bin]]
name = "bench_fqz_strand"
path = "src/bin/bench_fqz_strand.rs"

[[bin]]
name = "bench_fastr_bsc"
path = "src/bin/bench_fastr_bsc.rs"

[[bin]]
name = "bench_header_col"
path = "src/bin/bench_header_col.rs"

[[bin]]
name = "bench_kmer_prior"
path = "src/bin/bench_kmer_prior.rs"

[[bin]]
name = "bench_rc_orientation"
path = "src/bin/bench_rc_orientation.rs"

[[bin]]
name = "bench_sort_strategies"
path = "src/bin/bench_sort_strategies.rs"


[[bin]]
name = "bench_bounded_streaming"
path = "src/bin/bench_bounded_streaming.rs"

[[bin]]
name = "bench_bsc_per_stream"
path = "src/bin/bench_bsc_per_stream.rs"

[[bin]]
name = "bench_ref_decode_mem"
path = "src/bin/bench_ref_decode_mem.rs"

[[bin]]
name = "bench_qctx_blocksize"
path = "../../benchmarks/bench_qctx_blocksize.rs"

[[bin]]
name = "bench_reorder_cluster"
path = "src/bin/bench_reorder_cluster.rs"

[[bin]]
