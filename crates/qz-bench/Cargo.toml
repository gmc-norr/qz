[[bin]]
name = "bench_reorder_cluster_fused_pool"
path = "src/bin/bench_reorder_cluster_fused_pool.rs"

# qz-bench is throwaway profiling/benchmark code, not shipped. It mirrors the
# workspace clippy allows and additionally permits a few patterns that are fine
# in quick benchmark drivers (manual counters, field reassignment, etc.).
[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
explicit_counter_loop = "allow"
unnecessary_sort_by = "allow"
field_reassign_with_default = "allow"

[lints.rust]
unused_parens = "allow"
