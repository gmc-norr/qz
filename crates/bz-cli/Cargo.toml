[package]
name = "bz-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "BZ command-line tool for BAM compression"

[[bin]]
name = "bz"
path = "src/main.rs"

[features]
# Opt-in GPU: build with `--features cuda` to route bz's BSC BWT through the GPU
# (libcubwt) via qz-lib. Default build is CPU-only and portable.
cuda = ["bz-lib/cuda"]

[dependencies]
bz-lib.workspace = true
numa-core.workspace = true
mimalloc = "0.1.50"
clap.workspace = true
anyhow.workspace = true
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
noodles.workspace = true

[lints]
workspace = true
